<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0409" />
      <stop offset="50%" stop-color="#2d0811" />
      <stop offset="100%" stop-color="#140205" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2be" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#936e1f" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a060e" />
      <stop offset="100%" stop-color="#170306" />
    </linearGradient>
  </defs>

  <!-- Fondo General -->
  <rect width="800" height="500" fill="url(#bgCode)" />

  <!-- Rejilla decorativa de fondo -->
  <g stroke="#d4af37" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Ventana de Editor de Código Principal -->
  <g transform="translate(60, 40)">
    <!-- Marco Exterior Dorado -->
    <rect width="680" height="420" rx="16" fill="url(#cardGrad)" stroke="url(#goldAcc)" stroke-width="2" />
    
    <!-- Barra Superior de Ventana -->
    <path d="M0 16 C0 7 7 0 16 0 L664 0 C673 0 680 7 680 16 L680 44 L0 44 Z" fill="#380710" />
    <circle cx="28" cy="22" r="6" fill="#e5778b" />
    <circle cx="48" cy="22" r="6" fill="#eedb83" />
    <circle cx="68" cy="22" r="6" fill="#4ade80" />

    <!-- Título de pestaña activa -->
    <rect x="110" y="8" width="160" height="36" rx="8" fill="#1e0409" stroke="#d4af37" stroke-width="1" />
    <text x="190" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8ecb3" text-anchor="middle">&lt;/&gt; index.html</text>

    <!-- Pestaña 2 -->
    <rect x="280" y="8" width="140" height="36" rx="8" fill="#2d0811" opacity="0.6" />
    <text x="350" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#cca4ab" text-anchor="middle"># styles.css</text>

    <!-- Barra lateral de archivos -->
    <rect x="0" y="44" width="160" height="376" fill="#140205" />
    <text x="20" y="75" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#d4af37" letter-spacing="1">EXPLORADOR</text>
    
    <g font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#cca4ab">
      <text x="35" y="105">📁 src</text>
      <text x="50" y="130" fill="#f8ecb3">📄 index.html</text>
      <text x="50" y="155">🎨 styles.css</text>
      <text x="50" y="180">⚡ main.js</text>
      <text x="35" y="210">📁 componentes</text>
      <text x="35" y="235">📁 assets</text>
    </g>

    <!-- Líneas de Código en la Zona Principal -->
    <g transform="translate(180, 70)" font-family="'Courier New', monospace" font-size="14" font-weight="600">
      <text x="10" y="25" fill="#e5778b">&lt;!<span fill="#eedb83">DOCTYPE</span> <span fill="#4ade80">html</span>&gt;</text>
      <text x="10" y="55" fill="#e5778b">&lt;<span fill="#d4af37">div</span> <span fill="#eedb83">class</span>=<span fill="#4ade80">"portfolio-genesis"</span>&gt;</text>
      <text x="30" y="85" fill="#e5778b">&lt;<span fill="#d4af37">header</span> <span fill="#eedb83">class</span>=<span fill="#4ade80">"hero-vino-dorado"</span>&gt;</text>
      <text x="50" y="115" fill="#e5778b">&lt;<span fill="#d4af37">h1</span>&gt;<span fill="#fefcf3">Génesis Ríos</span>&lt;/<span fill="#d4af37">h1</span>&gt;</text>
      <text x="50" y="145" fill="#e5778b">&lt;<span fill="#d4af37">p</span> <span fill="#eedb83">class</span>=<span fill="#4ade80">"text-gold font-bold"</span>&gt;</text>
      <text x="70" y="175" fill="#f8ecb3">Frontend Developer Jr. • +ChicasTec</text>
      <text x="50" y="205" fill="#e5778b">&lt;/<span fill="#d4af37">p</span>&gt;</text>
      <text x="50" y="235" fill="#e5778b">&lt;<span fill="#d4af37">button</span> <span fill="#eedb83">class</span>=<span fill="#4ade80">"btn-gold-luxe"</span>&gt;<span fill="#fff2be">Explorar Proyectos</span>&lt;/<span fill="#d4af37">button</span>&gt;</text>
      <text x="30" y="265" fill="#e5778b">&lt;/<span fill="#d4af37">header</span>&gt;</text>
      <text x="10" y="295" fill="#e5778b">&lt;/<span fill="#d4af37">div</span>&gt;</text>
      
      <!-- Línea con cursor titilante dorado -->
      <line x1="10" y1="315" x2="10" y2="335" stroke="#d4af37" stroke-width="3" />
    </g>

    <!-- Mini mapa de código a la derecha -->
    <rect x="630" y="54" width="40" height="350" fill="#1e0409" rx="4" />
    <g fill="#d4af37" opacity="0.3">
      <rect x="635" y="65" width="30" height="3" />
      <rect x="635" y="73" width="22" height="3" />
      <rect x="635" y="81" width="28" height="3" />
      <rect x="635" y="89" width="18" height="3" />
      <rect x="635" y="97" width="26" height="3" />
      <rect x="635" y="105" width="20" height="3" />
    </g>
  </g>
</svg>
